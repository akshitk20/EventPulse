spring:
  application:
    name: eventpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpulse}
    username: ${DB_USER:eventpulse}
    password: ${DB_PASSWORD:eventpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
