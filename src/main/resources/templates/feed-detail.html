<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle=${item.title})}"></head>
<body>
<div class="wrap detail">
    <header th:replace="~{fragments/layout :: topbar(active='feed')}"></header>

    <a href="/feed" class="back-link">&larr; Back to feed</a>

    <article>
        <h1 th:text="${item.title}">Title</h1>

        <div class="meta">
            <span class="source-pill"
                  th:classappend="${item.source}"
                  th:text="${item.source}">source</span>
            <span th:if="${item.publishedAt}" class="dot">&middot;</span>
            <time th:if="${item.publishedAt}"
                  th:datetime="${item.publishedAt}"
                  th:title="${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')}"
                  th:text="${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')}">date</time>
            <th:block th:if="${not #sets.isEmpty(item.interests)}">
                <span class="dot">&middot;</span>
                <span th:each="i : ${item.interests}" class="interest-tag" th:text="${i.slug}">slug</span>
            </th:block>
        </div>

        <!-- Source-specific metadata block -->
        <section class="detail-section" th:switch="${item.source}">

            <div th:case="'hn'">
                <h3>Hacker News</h3>
                <dl>
                    <dt th:if="${item.metadata.containsKey('by') and !#strings.isEmpty(item.metadata['by'])}">Author</dt>
                    <dd th:if="${item.metadata.containsKey('by') and !#strings.isEmpty(item.metadata['by'])}"
                        th:text="${item.metadata['by']}">by</dd>
                </dl>
            </div>

            <div th:case="'reddit'">
                <h3>Reddit</h3>
                <dl>
                    <dt th:if="${item.metadata.containsKey('subreddit')}">Subreddit</dt>
                    <dd th:if="${item.metadata.containsKey('subreddit')}">
                        <a th:href="'https://www.reddit.com/r/' + ${item.metadata['subreddit']}"
                           target="_blank" rel="noopener"
                           th:text="'r/' + ${item.metadata['subreddit']}">r/sub</a>
                    </dd>
                    <dt th:if="${item.metadata.containsKey('author')}">Author</dt>
                    <dd th:if="${item.metadata.containsKey('author')}"
                        th:text="${'u/' + item.metadata['author']}">u/author</dd>
                    <dt th:if="${item.metadata.containsKey('score')}">Score</dt>
                    <dd th:if="${item.metadata.containsKey('score')}"
                        th:text="${item.metadata['score']}">score</dd>
                    <dt th:if="${item.metadata.containsKey('comments')}">Comments</dt>
                    <dd th:if="${item.metadata.containsKey('comments')}"
                        th:text="${item.metadata['comments']}">comments</dd>
                    <dt th:if="${item.metadata.containsKey('permalink')}">Discussion</dt>
                    <dd th:if="${item.metadata.containsKey('permalink')}">
                        <a th:href="${item.metadata['permalink']}" target="_blank" rel="noopener">View on Reddit</a>
                    </dd>
                </dl>
            </div>

            <div th:case="'sportsdb'">
                <h3>Match details</h3>
                <dl>
                    <dt th:if="${item.metadata.containsKey('league')}">League</dt>
                    <dd th:if="${item.metadata.containsKey('league')}"
                        th:text="${item.metadata['league']}">league</dd>
                    <dt th:if="${item.metadata.containsKey('sport')}">Sport</dt>
                    <dd th:if="${item.metadata.containsKey('sport')}"
                        th:text="${item.metadata['sport']}">sport</dd>
                    <dt th:if="${item.metadata.containsKey('status')}">Status</dt>
                    <dd th:if="${item.metadata.containsKey('status')}"
                        th:text="${item.metadata['status']}">status</dd>
                </dl>
                <div class="scoreline"
                     th:if="${item.metadata.containsKey('homeTeam') and item.metadata.containsKey('awayTeam')}">
                    <span class="team home" th:text="${item.metadata['homeTeam']}">Home</span>
                    <span class="score" th:if="${item.metadata.containsKey('homeScore')}"
                          th:text="${item.metadata['homeScore']}">0</span>
                    <span class="vs">vs</span>
                    <span class="score" th:if="${item.metadata.containsKey('awayScore')}"
                          th:text="${item.metadata['awayScore']}">0</span>
                    <span class="team away" th:text="${item.metadata['awayTeam']}">Away</span>
                </div>
            </div>

            <div th:case="*">
                <h3 th:text="${item.source}">source</h3>
                <p style="color:var(--muted);margin:0">No source-specific details.</p>
            </div>
        </section>

        <!-- Engagement actions -->
        <div class="actions" th:id="'actions-' + ${item.id}">
            <a class="button primary" th:href="${item.url}" target="_blank" rel="noopener"
               th:attr="onclick=|recordClick('${item.id}');|">Open original</a>
            <button th:hx-post="@{'/engagements/SAVE/' + ${item.id}}"
                    th:hx-target="'#actions-' + ${item.id}"
                    hx-swap="outerHTML">Save</button>
            <button th:hx-post="@{'/engagements/HIDE/' + ${item.id}}"
                    th:hx-target="'#actions-' + ${item.id}"
                    hx-swap="outerHTML">Hide</button>
        </div>
    </article>
</div>
</body>
</html>
