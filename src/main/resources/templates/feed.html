<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Feed')}"></head>
<body>
<div class="wrap">
    <header th:replace="~{fragments/layout :: topbar(active='feed')}"></header>

    <h2 class="page-title">Your feed</h2>

    <form method="get" action="/feed" class="filter-bar">
        <input type="search" name="q" th:value="${q}"
               placeholder="Search titles…" autocomplete="off"/>
        <input type="hidden" name="source" th:value="${activeSource}" th:if="${activeSource}"/>
        <input type="hidden" name="interest" th:value="${activeInterestId}" th:if="${activeInterestId}"/>
        <button type="submit">Search</button>
        <a th:if="${(q != null and !#strings.isEmpty(q)) or activeSource != null or activeInterestId != null}"
           href="/feed" class="clear">Clear</a>
    </form>

    <div class="filter-chips">
        <span class="chip-label">Source:</span>
        <a th:each="s : ${sources}"
           th:with="nextSource=${s == activeSource ? null : s}"
           th:href="@{/feed(q=${q}, source=${nextSource}, interest=${activeInterestId})}"
           class="chip source-chip"
           th:classappend="${s == activeSource} ? 'active'"
           th:text="${s}">hn</a>
    </div>

    <div class="filter-chips" th:if="${not #lists.isEmpty(subscribedInterests)}">
        <span class="chip-label">Interest:</span>
        <a th:each="i : ${subscribedInterests}"
           th:with="nextInterest=${i.id == activeInterestId ? null : i.id}"
           th:href="@{/feed(q=${q}, source=${activeSource}, interest=${nextInterest})}"
           class="chip interest-chip"
           th:classappend="${i.id == activeInterestId} ? 'active'"
           th:text="${i.displayName}">Soccer</a>
    </div>

    <p th:if="${#lists.isEmpty(items)}" class="empty">
        No items yet. Subscribe to interests to populate your feed.
    </p>

    <article th:each="item : ${items}" class="item" th:id="'item-' + ${item.id}">
        <a class="card-link" th:href="@{'/feed/' + ${item.id}}" th:aria-label="${item.title}"></a>
        <h2>
            <a th:href="@{'/feed/' + ${item.id}}" th:text="${item.title}">title</a>
        </h2>
        <div class="meta">
            <span class="source-pill"
                  th:classappend="${item.source}"
                  th:text="${item.source}">source</span>
            <span th:if="${item.publishedAt}" class="dot">&middot;</span>
            <time th:if="${item.publishedAt}"
                  th:datetime="${item.publishedAt}"
                  th:title="${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')}"
                  th:text="${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')}">date</time>
            <th:block th:if="${not #sets.isEmpty(item.interests)}">
                <span class="dot">&middot;</span>
                <span th:each="i : ${item.interests}" class="interest-tag" th:text="${i.slug}">slug</span>
            </th:block>
        </div>

        <div class="actions" th:id="'actions-' + ${item.id}">
            <a class="button" th:href="${item.url}" target="_blank" rel="noopener"
               th:attr="onclick=|event.stopPropagation(); recordClick('${item.id}');|">Open original</a>
            <button onclick="event.stopPropagation()"
                    th:hx-post="@{'/engagements/SAVE/' + ${item.id}}"
                    th:hx-target="'#actions-' + ${item.id}"
                    hx-swap="outerHTML">Save</button>
            <button onclick="event.stopPropagation()"
                    th:hx-post="@{'/engagements/HIDE/' + ${item.id}}"
                    th:hx-target="'#item-' + ${item.id}"
                    hx-swap="outerHTML">Hide</button>
        </div>
    </article>

    <nav class="pager" th:if="${page > 0 or hasNext}">
        <a th:if="${page > 0}"
           th:href="@{/feed(page=${page - 1}, q=${q}, source=${activeSource}, interest=${activeInterestId})}">&larr; Newer</a>
        <span th:unless="${page > 0}"></span>
        <span class="spacer"></span>
        <a th:if="${hasNext}"
           th:href="@{/feed(page=${page + 1}, q=${q}, source=${activeSource}, interest=${activeInterestId})}">Older &rarr;</a>
    </nav>
</div>
</body>
</html>
