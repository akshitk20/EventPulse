<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Feed &middot; EventPulse</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script>
        document.addEventListener('htmx:configRequest', (e) => {
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (tokenMeta && headerMeta) {
                e.detail.headers[headerMeta.content] = tokenMeta.content;
            }
        });
    </script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .item { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .item h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
        .meta { color: #666; font-size: .85rem; }
        .actions { margin-top: .75rem; display: flex; gap: .5rem; }
        .actions button { font-size: .85rem; padding: .25rem .6rem; cursor: pointer; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <h1>Your feed</h1>
        <nav>
            <a href="/interests">Interests</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">Sign out</button>
            </form>
        </nav>
    </header>

    <p th:if="${#lists.isEmpty(items)}" class="empty">
        No items yet. Subscribe to interests to populate your feed.
    </p>

    <article th:each="item : ${items}" class="item" th:id="'item-' + ${item.id}">
        <h2>
            <a th:href="${item.url}" th:text="${item.title}" target="_blank" rel="noopener">title</a>
        </h2>
        <div class="meta">
            <span th:text="${item.source}">source</span>
            <span th:if="${item.publishedAt}"> &middot;
                <time th:datetime="${item.publishedAt}"
                      th:text="${#temporals.format(item.publishedAt, 'yyyy-MM-dd HH:mm')}">date</time>
            </span>
            <span th:if="${item.relatedEvent}"> &middot;
                <span th:text="${item.relatedEvent.title}">event</span>
            </span>
        </div>

        <div class="actions" th:id="'actions-' + ${item.id}">
            <button th:hx-post="@{'/engagements/SAVE/' + ${item.id}}"
                    th:hx-target="'#actions-' + ${item.id}"
                    hx-swap="outerHTML">Save</button>
            <button th:hx-post="@{'/engagements/HIDE/' + ${item.id}}"
                    th:hx-target="'#item-' + ${item.id}"
                    hx-swap="delete">Hide</button>
            <button th:hx-post="@{'/engagements/CLICK/' + ${item.id}}"
                    th:hx-target="'#actions-' + ${item.id}"
                    hx-swap="outerHTML">Mark read</button>
        </div>
    </article>

    <nav>
        <a th:if="${page > 0}" th:href="@{/feed(page=${page - 1})}">&larr; Newer</a>
        <a th:if="${hasNext}" th:href="@{/feed(page=${page + 1})}">Older &rarr;</a>
    </nav>
</body>
</html>
