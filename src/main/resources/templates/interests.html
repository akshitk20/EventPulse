<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Interests')}"></head>
<body>
<div class="wrap">
    <header th:replace="~{fragments/layout :: topbar(active='interests')}"></header>

    <h2 class="page-title">Interests</h2>
    <p style="color:var(--muted); margin-top:-.75rem; margin-bottom:1.5rem;">
        Pick what you want to follow. Your feed is built from these.
    </p>

    <style>
        .category-title {
            font-family: var(--serif);
            font-size: 1.1rem;
            font-weight: 600;
            margin: 1.75rem 0 .75rem;
            color: var(--text);
        }
        .category-title:first-of-type { margin-top: 0; }
        .root {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: .85rem;
        }
        .root-name { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .root-name > span:first-child {
            font-weight: 500;
            font-size: 1rem;
        }
        .children {
            display: flex; flex-wrap: wrap; gap: .4rem;
            margin-top: .85rem;
            padding-top: .85rem;
            border-top: 1px solid var(--border);
        }
        .toggle button {
            font-family: inherit;
            font-size: .82rem;
            padding: .3rem .75rem;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 999px;
            transition: background .12s, border-color .12s, color .12s;
        }
        .toggle button:hover {
            background: #f5f2ec;
            border-color: var(--border-strong);
        }
        .toggle button.on {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .toggle button.on:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
    </style>

    <th:block th:each="entry : ${rootsByCategory}">
        <h3 class="category-title" th:text="${entry.key}">CATEGORY</h3>
        <div th:each="root : ${entry.value}" class="root">
            <div class="root-name">
                <span th:text="${root.displayName}">Sports</span>
                <span class="toggle" th:replace="~{fragments/interest-toggle :: toggle(
                    interestId=${root.id},
                    subscribed=${subscribedIds.contains(root.id)},
                    displayName=${root.displayName}
                )}"></span>
            </div>
            <div class="children" th:if="${childrenByParent.containsKey(root.id)}">
                <th:block th:each="child : ${childrenByParent.get(root.id)}">
                    <span class="toggle" th:replace="~{fragments/interest-toggle :: toggle(
                        interestId=${child.id},
                        subscribed=${subscribedIds.contains(child.id)},
                        displayName=${child.displayName}
                    )}"></span>
                </th:block>
            </div>
        </div>
    </th:block>
</div>
</body>
</html>
