spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eventpulse_test
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: false

  thymeleaf:
    cache: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid, profile, email

eventpulse:
  youtube:
    api-key: ""

logging:
  level:
    com.eventpulse: WARN
